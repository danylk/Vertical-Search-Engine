<!DOCTYPE html>
<html lang="en">
<head>
  <title>Relevance Assessment</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container-fluid p-3 bg-dark text-white text-center">
  <h3 style="font-family:times; cursor: pointer;" onclick="window.location.href='/'">Relevance Assessment</h3>
</div>

<div class="container mb-5">
  <div class="row p-5">
    <div class="col-sm-4" style="position: fixed !important">
      <p><b>Query ID:</b> {{ queryID }}</p>
      <p><b>Query:</b> {{ query }}</p>
      <p><b>Assessor ID:</b> {{ assessorID }}</p>
      <p><b>Doc Num:</b> {{ docNum }}</p>
      <p style="word-break: break-all; white-space: normal; width: 300px"><b>Doc ID:</b> <a href="{{ docID }}">{{ docID }}</a></p>
      <form action="/assessment" method="POST">
        <input type="hidden" name="queryID" value="{{ queryID }}">
        <input type="hidden" name="assessorID" value="{{ assessorID }}">
        <input type="hidden" name="docNum" value="{{ docNum }}">
        <button type="submit" name="grade" value="0" class="btn btn-outline-danger" style="border-radius: 0 !important;">Non-relevant</button>
        <button type="submit" name="grade" value="1" class="btn btn-outline-primary" style="border-radius: 0 !important;">Relevant</button>
        <button type="submit" name="grade" value="2" class="btn btn-outline-success" style="border-radius: 0 !important;">Very Relevant</button>
      </form>
    </div>
    <div class="col-sm-4"></div>
    <div class="col-sm-8">
      <h4 class="font-weight-bold mb-4" style="word-break: break-all; white-space: normal;"><i>{{ docID }}</i></h4>
      <p id="content" style="word-break: break-all; white-space: normal;">{{ content }}</p>
    </div>
  </div>
</div>

</body>
<script>
  var query = "{{ query }}"
  var words = query.split(" ")

  var p = document.getElementById('content')
  var content = document.getElementById('content').innerHTML;

  for (var i = 0; i < words.length; i++) {

    if (content.includes(words[i])) {
      content = content.replace(RegExp("(" + words[i] + ")", 'ig'), '<mark>' + words[i] + '</mark>');
      p.innerHTML = content
    }
  }
</script>
</html>
