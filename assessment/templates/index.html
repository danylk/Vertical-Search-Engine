<!DOCTYPE html>
<html lang="en">
<head>
  <title>Relevance Assessment</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container-fluid p-3 bg-dark text-white text-center">
  <h3 style="font-family:times; cursor: pointer;" onclick="window.location.href='/'">Relevance Assessment</h3>
</div>

<div class="container mb-5">
  <div class="row p-5">
    <div class="col-4 mx-auto">
      <form action="/assessment" method="POST">
        <div class="form-group my-3">
          <label>Query ID</label>
          <input type="number" class="form-control" name="queryID" placeholder="Query ID" value="0">
        </div>
        <div class="form-group my-3">
          <label>Assessor ID</label>
          <input type="text" class="form-control" name="assessorID" placeholder="Your first name" value="sunkwan">
        </div>
        <div class="form-group my-3">
          <label>Document Index</label>
          <input type="number" class="form-control" name="docNum" placeholder="What document do you want to start with?" value="0">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    </div>
  </div>
</div>
</body>
</html>
